name: Django tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PycharmProjects/PythonProject2

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.3"
          cache: pip
          cache-dependency-path: PycharmProjects/PythonProject2/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run tests and save results
        run: |
          set -o pipefail
          python manage.py test --verbosity 2 2>&1 | tee test-results.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: django-test-results
          path: PycharmProjects/PythonProject2/test-results.txt
          if-no-files-found: warn