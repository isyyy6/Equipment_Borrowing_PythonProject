{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h1 class="h3 mb-3">Log in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="mt-3">No account yet? <a href="{% url 'accounts:register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
